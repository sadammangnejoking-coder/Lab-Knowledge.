
<!DOCTYPE html>
<html lang="en">
<head>
  
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#075985">
<meta name="mobile-web-app-capable" content="yes">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Knowledge</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f0f5fa;color:#172b40}
header{background:#075985;color:white;padding:25px 18px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0}
main{padding:16px;max-width:700px;margin:auto}
input{width:100%;padding:14px;border:1px solid #bbb;border-radius:10px;font-size:16px}
h2{color:#075985}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
.card h3{margin:0 0 8px;color:#075985}
button{background:#0284c7;color:white;border:0;padding:10px 14px;border-radius:8px}
footer{text-align:center;background:#075985;color:white;padding:20px;margin-top:25px}
small{color:#dbeafe}
</style>
</head>
<body>
<header>
<h1>🔬 Lab Knowledge</h1>
<p>Laboratory Investigations Theory</p>
</header>
<main>
<h2>Search Laboratory Tests</h2>
<input id="search" placeholder="Search test name..." oninput="showTests()">
<div id="tests"></div>
</main>
<footer>
<p>Developer by Sadam Hussain</p>
<p>Contact: +92 315 3847467</p>
<p>Email: Sadam_mangnejo@yahoo.com</p>
<small>Educational purpose only</small>
</footer>
<script>
const data=[
{name:"CBC",range:"Hemoglobin: Male 13.5–17.5 g/dL; Female 12–15.5 g/dL",info:"Complete Blood Count measures red cells, white cells and platelets.",sample:"EDTA blood"},
{name:"Blood Glucose Fasting",range:"Common reference: 70–99 mg/dL",info:"Measures blood sugar after fasting.",sample:"Fluoride plasma"},
{name:"HbA1c",range:"Normal: Below 5.7%",info:"Reflects average blood glucose over approximately 2–3 months.",sample:"EDTA blood"},
{name:"Serum Creatinine",range:"Approximately 0.6–1.3 mg/dL in adults",info:"Helps assess kidney function.",sample:"Serum"},
{name:"Blood Urea",range:"Approximately 15–40 mg/dL",info:"Helps evaluate kidney function and nitrogen metabolism.",sample:"Serum"},
{name:"ALT",range:"Often 7–56 U/L",info:"An enzyme used in assessment of liver injury.",sample:"Serum"},
{name:"AST",range:"Often 10–40 U/L",info:"An enzyme found in liver and other tissues.",sample:"Serum"},
{name:"TSH",range:"Approximately 0.4–4.0 mIU/L",info:"Used to assess thyroid function.",sample:"Serum"},
{name:"Vitamin D",range:"Interpretation depends on laboratory and clinical context.",info:"Measures 25-hydroxy vitamin D.",sample:"Serum"}
];
function showTests(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("tests").innerHTML=data.filter(t=>t.name.toLowerCase().includes(q)).map(t=>`
<div class="card">
<h3>${t.name}</h3>
<p><b>Reference range:</b> ${t.range}</p>
<p><b>Clinical significance:</b> ${t.info}</p>
<p><b>Specimen:</b> ${t.sample}</p>
</div>`).join("")||"<p>No test found.</p>";
}
showTests();
</script>
  
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>

</body>
</html>
